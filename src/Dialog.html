<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: Arial, sans-serif; font-size: 13px; margin: 14px; color: #202124; }
  input { width: 100%; padding: 6px; box-sizing: border-box; margin: 4px 0 12px; }
  button { padding: 6px 14px; cursor: pointer; }
  .error { color: #b00020; }
</style>
</head>
<body>
<p>This builds a report for every active client and emails each client the PDF. Send to me first does not apply here.</p>
<label for="month">Month to close</label>
<input id="month" value="<?= month ?>">
<button id="confirm" type="button">Close month</button>
<button id="cancel" type="button">Cancel</button>
<p id="status" role="status"></p>
<script>
  function setStatus(text, isError) {
    var el = document.getElementById('status');
    el.textContent = text;
    el.className = isError ? 'error' : '';
  }
  // The month the dialog has already said rows are left out for. Pressing the button again for that month is the second confirmation.
  var told = '';
  function resetConfirm() {
    told = '';
    document.getElementById('confirm').textContent = 'Close month';
  }
  document.getElementById('month').oninput = resetConfirm;
  document.getElementById('cancel').onclick = function () { google.script.host.close(); };
  document.getElementById('confirm').onclick = function () {
    var asked = document.getElementById('month').value;
    document.getElementById('confirm').disabled = true;
    setStatus('Working');
    google.script.run
      .withSuccessHandler(function (r) {
        if (r.held) {
          told = asked;
          document.getElementById('confirm').textContent = 'Close month anyway';
          document.getElementById('confirm').disabled = false;
          setStatus('Nothing has been emailed yet. ' + r.held.text + ' A report built now is too low by those rows. Press Close month anyway to email the clients with these rows left out, or Cancel and fix the rows first.');
          return;
        }
        resetConfirm();
        var text = r.done + ' done, ' + r.errors + ' failed, ' + r.pending + ' waiting, ' + r.emailed + ' emailed, ' +
          r.emailFailed + ' not emailed (mail refused; the next close sends them).';
        if (r.clashes) text += ' Not reported: ' + r.clashes.join(' ');
        if (r.skipped) text += ' Summaries left out: ' + r.skipped.join(' ');
        if (r.unmatched) text += ' ' + r.unmatched.rows + ' Campaigns row(s) name a client that is not in the Clients tab (' +
          r.unmatched.clients.join(', ') + ').';
        if (r.leftOut) text += ' ' + r.leftOut.text;
        if (r.noAddress) text += ' ' + r.noAddress.text;
        if (r.unknownStatus) text += ' ' + r.unknownStatus.text;
        setStatus(text);
        document.getElementById('confirm').disabled = false;
      })
      .withFailureHandler(function (err) {
        document.getElementById('confirm').disabled = false;
        setStatus(err && err.message ? err.message : 'Something went wrong.', true);
      })
      .dialogConfirmMonthClose(asked, told === asked);
  };
</script>
</body>
</html>
